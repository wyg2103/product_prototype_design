<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>朋友圈详情 - 企业微信 SCRM</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/detail.css" />
</head>
<body class="detail-page">
  <div id="app-header"></div>

  <div class="app-body">
    <div id="app-sidebar"></div>

    <main class="main-area">
      <div class="page-tabs">
        <div class="page-tab"><a href="index.html" style="color:inherit;text-decoration:none">官方朋友圈</a> <span class="close">×</span></div>
        <div class="page-tab active">朋友圈详情 <span class="close">×</span></div>
      </div>

      <div class="detail-main" id="detailRoot">
        <nav class="detail-breadcrumb">
          <a href="index.html" id="backList">官方朋友圈</a>
          <span class="sep">/</span>
          <span id="breadcrumbSource">个人发表</span>
          <span class="sep">/</span>
          <span class="current">朋友圈详情</span>
        </nav>

        <header class="detail-header">
          <h1 class="detail-page-title">朋友圈详情</h1>
        </header>

        <section class="detail-card detail-top">
          <div class="phone-preview">
            <div class="phone-frame">
              <div class="phone-cover">
                <div class="phone-profile">
                  <span class="name" id="previewName">—</span>
                  <span class="phone-avatar" id="previewAvatar">—</span>
                </div>
              </div>
              <div class="phone-body">
                <div class="phone-moment-date" id="previewDate">—</div>
                <div class="phone-moment-text" id="previewContent">—</div>
              </div>
            </div>
            <p class="phone-caption">朋友圈预览</p>
          </div>

          <div class="detail-meta" id="detailMeta"></div>
        </section>

        <section class="detail-card records-section">
          <div class="section-head">
            <h2 class="records-section-title">任务记录</h2>
            <button type="button" class="btn-primary" id="btnExport">导出 Excel</button>
          </div>

          <div class="filter-card records-filter-card">
            <div class="records-filter">
              <div class="filter-item">
                <label>员工名称</label>
                <select id="filterEmp">
                  <option value="">请选择员工</option>
                </select>
              </div>
              <div class="filter-item">
                <label>手机号</label>
                <input type="text" id="filterPhone" placeholder="请输入手机号" maxlength="11" />
                <span class="phone-counter" id="phoneCounter">0/11</span>
              </div>
              <div class="filter-item">
                <label>所属部门</label>
                <select id="filterDept">
                  <option value="">请选择部门</option>
                </select>
              </div>
              <button type="button" class="btn-primary" id="btnRecordSearch">搜索</button>
              <a href="#" class="link-clear" id="btnRecordClear">清空搜索条件</a>
            </div>
          </div>

          <div class="table-wrap">
            <table class="data-table" id="recordsTable">
              <thead>
                <tr>
                  <th>员工</th>
                  <th>手机号</th>
                  <th>所在部门</th>
                  <th>是否发送</th>
                  <th>发送时间</th>
                  <th>朋友圈可见范围</th>
                  <th>评论数</th>
                  <th>点赞数</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="recordsBody"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-overlay" id="modal">
    <div class="modal modal-wide" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span id="modalTitle">明细</span>
        <button type="button" class="modal-close" id="modalClose">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn-primary" id="modalOk">关闭</button>
      </div>
    </div>
  </div>

  <script src="js/layout.js"></script>
  <script src="js/data.js"></script>
  <script src="js/detail.js"></script>
  <script>AppLayout.mountLayout({ expandModule: 'moments', activeItem: 'official' });</script>
</body>
</html>
