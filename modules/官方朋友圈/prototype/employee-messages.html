<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>消息 - 企微客户端</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/employee-moments.css" />
</head>
<body class="emp-page">
  <div class="emp-phone msg-page">
    <div class="emp-status light">
      <span>9:41</span>
      <span class="icons">●●● ▮</span>
    </div>
    <div class="msg-header">
      <div class="msg-header-row">
        <a href="#" class="msg-menu" aria-label="菜单">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          <span class="dot">14</span>
        </a>
        <div class="msg-title">消息</div>
        <div class="msg-header-actions">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </div>
      </div>
      <div class="msg-filters">
        <span class="on">全部 ▾</span>
        <span>日程</span>
        <span>会议</span>
      </div>
    </div>

    <div class="emp-scroll">
      <div class="msg-list">
        <a class="msg-item focus" href="employee-assistant.html">
          <div class="msg-avatar assistant">
            <span class="badge" id="assistantBadge">5</span>
          </div>
          <div class="msg-body">
            <div class="msg-row1">
              <div class="msg-name">企迈企微助手_pro</div>
              <div class="msg-time">10:40</div>
            </div>
            <div class="msg-preview" id="assistantPreview">【待发朋友圈任务】你有一条朋友圈任务待完成哦！</div>
          </div>
        </a>

        <a class="msg-item" href="employee-moments.html">
          <div class="msg-avatar moments">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>
            <span class="badge" id="momentsBadge" hidden>0</span>
          </div>
          <div class="msg-body">
            <div class="msg-row1">
              <div class="msg-name">客户朋友圈</div>
              <div class="msg-time">周三</div>
            </div>
            <div class="msg-preview" id="momentsPreview">管理员通知你发表内容到客户的朋友圈</div>
          </div>
        </a>

        <a class="msg-item" href="#">
          <div class="msg-avatar news"><span class="badge">6</span>讯</div>
          <div class="msg-body">
            <div class="msg-row1">
              <div class="msg-name">行业资讯</div>
              <div class="msg-time">10:05</div>
            </div>
            <div class="msg-preview">餐饮行业最新动态与运营干货</div>
          </div>
        </a>

        <a class="msg-item" href="#">
          <div class="msg-avatar summary"><span class="badge">2</span>周</div>
          <div class="msg-body">
            <div class="msg-row1">
              <div class="msg-name">一周小结</div>
              <div class="msg-time">昨天</div>
            </div>
            <div class="msg-preview">本周企业微信使用小结已生成</div>
          </div>
        </a>

        <a class="msg-item" href="#">
          <div class="msg-avatar team"><span class="badge">3</span>企</div>
          <div class="msg-body">
            <div class="msg-row1">
              <div class="msg-name">企业微信团队</div>
              <div class="msg-time">昨天</div>
            </div>
            <div class="msg-preview">你已登录服务商后台</div>
          </div>
        </a>

        <a class="msg-item" href="#">
          <div class="msg-avatar user">L</div>
          <div class="msg-body">
            <div class="msg-row1">
              <div class="msg-name">Lee <span class="ext">外部</span></div>
              <div class="msg-time">周二</div>
            </div>
            <div class="msg-preview">好的，我这边跟进一下</div>
          </div>
        </a>

        <a class="msg-item" href="#">
          <div class="msg-avatar user">高</div>
          <div class="msg-body">
            <div class="msg-row1">
              <div class="msg-name">高新产业园福利群 <span class="ext">外部</span></div>
              <div class="msg-time">7/8</div>
            </div>
            <div class="msg-preview">[链接]邀请好友加群得优惠</div>
          </div>
        </a>
      </div>
    </div>

    <div class="msg-tabbar">
      <a class="msg-tab active" href="employee-messages.html">
        <span class="badge">25</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.4 8.4 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.4 8.4 0 01-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.4 8.4 0 013.8-.9h.5a8.5 8.5 0 018 8v.5z"/></svg>
        消息
      </a>
      <a class="msg-tab" href="#">
        <span class="badge">1</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4z"/><path d="M4 8h16M9 12h6"/></svg>
        邮件
      </a>
      <a class="msg-tab" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
        文档
      </a>
      <a class="msg-tab" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        工作台
      </a>
      <a class="msg-tab" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        通讯录
      </a>
    </div>
  </div>

  <script src="js/layout.js"></script>
  <script src="js/data.js"></script>
  <script src="js/employee-moments.js"></script>
  <script>
    AppLayout.mountPerspectiveSwitch('client');
    EmployeeMoments.initMessages();
  </script>
</body>
</html>
