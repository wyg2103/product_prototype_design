<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>客户群发 - 企业微信 SCRM</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/mass-send.css" />
</head>
<body>
  <div id="app-header"></div>
  <div class="app-body">
    <div id="app-sidebar"></div>
    <main class="main-area">
      <div class="page-tabs mass-page-tabs">
        <div class="page-tab active">客户群发 <span class="close">×</span></div>
      </div>
      <section class="mass-content">
        <div class="mass-scroll">
          <div class="filter-card">
            <div class="mass-filter-grid">
              <div class="filter-item">
                <label>所属人员</label>
                <input type="text" id="filterStaff" placeholder="请输入所属人员" class="form-input" style="max-width:none" />
              </div>
              <div class="filter-item">
                <label>发送时间</label>
                <div class="date-range">
                  <input type="date" id="filterSendStart" />
                  <span>至</span>
                  <input type="date" id="filterSendEnd" />
                </div>
              </div>
              <div class="filter-item">
                <label>创建人</label>
                <input type="text" id="filterCreator" placeholder="请输入创建人" class="form-input" style="max-width:none" />
              </div>
              <div class="filter-item">
                <label>群发任务名称</label>
                <input type="text" id="filterName" placeholder="请输入任务名称" class="form-input" style="max-width:none" />
              </div>
              <div class="filter-item">
                <label>状态</label>
                <select id="filterStatus" class="form-input" style="max-width:none">
                  <option value="">全部</option>
                  <option value="completed">已完成</option>
                  <option value="running">执行中</option>
                  <option value="scheduled">待发送</option>
                </select>
              </div>
            </div>
            <div class="mass-filter-actions">
              <button type="button" class="btn-primary" id="btnQuery">查询</button>
              <button type="button" class="btn-outline" id="btnReset">重置</button>
            </div>
          </div>

          <div class="mass-toolbar">
            <div class="mass-toolbar-left">
              <a href="mass-send-create.html" class="btn-primary btn-lg" style="display:inline-flex;align-items:center;text-decoration:none">新建群发</a>
              <button type="button" class="btn-outline" id="btnRefresh">刷新状态</button>
              <button type="button" class="btn-outline" id="btnSyncApi">刷新数据</button>
              <button type="button" class="btn-outline" id="btnExport">导出 EXCEL</button>
              <a href="#" class="mass-help-link" id="btnHelp">什么是客户群发？</a>
            </div>
            <div class="mass-type-tabs">
              <span class="mass-type-tab active" data-type="immediate">立即发送</span>
              <span class="mass-type-tab" data-type="scheduled">定时发送</span>
              <span class="mass-type-tab" data-type="periodic">周期任务</span>
            </div>
          </div>

          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>群发任务名称</th>
                  <th>群发内容</th>
                  <th>所属人员</th>
                  <th>任务下发</th>
                  <th>发送时间</th>
                  <th>状态</th>
                  <th>未发送员工</th>
                  <th>已发送员工</th>
                  <th>创建人</th>
                  <th>创建时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="massTableBody"></tbody>
            </table>
          </div>

          <div class="pagination-bar">
            <span>共 <strong id="massTotal">4</strong> 条</span>
            <select><option>10 条/页</option></select>
            <div class="page-btns">
              <button type="button" disabled>‹</button>
              <button type="button" class="active">1</button>
              <button type="button">›</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <div class="modal-overlay" id="modal">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header"><span id="modalTitle">提示</span><button type="button" class="modal-close" id="modalClose">×</button></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer"><button type="button" class="btn-primary" id="modalOk">知道了</button></div>
    </div>
  </div>

  <script src="js/layout.js"></script>
  <script src="js/mass-send-data.js"></script>
  <script src="js/mass-send.js"></script>
  <script>AppLayout.mountLayout({ expandModule: 'reach', activeItem: 'mass-send' });</script>
</body>
</html>
